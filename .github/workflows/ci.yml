name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest is now 26.04, which the locked Playwright (1.59)
    # cannot install browsers on. Unpin together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e

      - name: E2E on the SQLite backend
        run: npm run test:e2e
        env:
          SELFHEAL_STORE_PATH: storage/element-metadata.db

      - run: npm run build

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-node-${{ matrix.node }}
          path: playwright-report
          retention-days: 7
