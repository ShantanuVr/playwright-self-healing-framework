<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Self-Healing Demo - Checkout v3 (Text Drift)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      DOUBLE DRIFT: structural (ids/classes) AND textual.
      - "Submit Order"  -> "Place Order"   (button copy rewritten)
      - "Email address" -> "Email"         (label copy shortened)
      - "Coupon code"   -> "Promo code"    (label copy reworded)

      This scenario proves the engine survives copy changes by leaning on
      the non-text signals (tag, anchor context, attributes, sibling
      topology) that the scoring blend also considers.
    -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 40px;
        margin: 0;
      }
      .wrap {
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        padding: 32px;
        border-radius: 10px;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      }
      h1 { margin: 0 0 6px; color: #1e293b; font-size: 22px; }
      .sub { color: #64748b; margin-bottom: 24px; font-size: 14px; }
      label { display: block; font-weight: 600; margin: 14px 0 6px; color: #334155; font-size: 14px; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
      }
      input:focus { outline: 2px solid #2563eb; outline-offset: 1px; }
      .actions { display: flex; gap: 12px; margin-top: 20px; }
      button {
        flex: 1;
        padding: 11px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
      }
      .cta-btn { background: #2563eb; color: white; }
      .cta-btn:hover { background: #1d4ed8; }
      .secondary-btn { background: #e2e8f0; color: #475569; }
      .secondary-btn:hover { background: #cbd5e1; }
      .status {
        margin-top: 18px;
        font-weight: 600;
        color: #166534;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Checkout (v3 - Text Drift)</h1>
      <div class="sub">Text AND structure changed – the anchor signals (sibling topology, label association, tag, attributes) carry the heal.</div>

      <form id="order-form-v3">
        <label for="email_q7">Email</label>
        <input
          id="email_q7"
          name="contact_email"
          class="form-control"
          type="email"
          placeholder="you@example.com"
        />

        <label for="promo_z9">Promo code</label>
        <input
          id="promo_z9"
          name="promo_code"
          class="form-control"
          type="text"
          placeholder="SAVE10"
        />

        <div class="actions">
          <button id="placeOrderBtn" class="cta-btn" type="button">
            Place Order
          </button>
          <button id="abortBtn" class="secondary-btn" type="button">Back</button>
        </div>
      </form>

      <p id="feedback" class="status"></p>
    </div>

    <script>
      document.getElementById('placeOrderBtn').addEventListener('click', () => {
        const email = document.getElementById('email_q7').value;
        const msg = document.getElementById('feedback');
        msg.textContent = email
          ? `Order submitted successfully for ${email}!`
          : 'Order submitted successfully!';
      });
      document.getElementById('abortBtn').addEventListener('click', () => {
        document.getElementById('feedback').textContent = 'Order cancelled.';
      });
    </script>
  </body>
</html>
